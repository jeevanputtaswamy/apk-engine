name: Public APK Builder

on:
  repository_dispatch:
    types: [build_apk]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js & Java JDK
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Build TWA APK
        run: |
          keytool -genkeypair -v -keystore android.keystore -alias android -keyalg RSA -keysize 2048 -validity 10000 -storepass password123 -keypass password123 -dname "CN=${{ github.event.client_payload.appName }}, OU=Dev, O=Dev, L=City, S=State, C=US"
          cat << 'EOF' > twa-manifest.json
          {
            "packageId": "${{ github.event.client_payload.packageId }}",
            "host": "${{ github.event.client_payload.appUrl }}",
            "name": "${{ github.event.client_payload.appName }}",
            "launcherName": "${{ github.event.client_payload.appName }}",
            "display": "standalone",
            "themeColor": "#000000",
            "navigationColor": "#000000",
            "backgroundColor": "#000000",
            "enableNotifications": false,
            "startUrl": "/",
            "iconUrl": "${{ github.event.client_payload.iconUrl }}",
            "maskableIconUrl": "${{ github.event.client_payload.iconUrl }}",
            "appVersion": "1.0.0",
            "appVersionCode": 1,
            "signingKey": {
              "path": "./android.keystore",
              "alias": "android"
            },
            "generatorApp": "bubblewrap-cli",
            "webManifestUrl": "${{ github.event.client_payload.appUrl }}/manifest.webmanifest",
            "fallbackType": "customtabs"
          }
          EOF
          bubblewrap build --skipPwaValidation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.client_payload.appName }}-APK
          path: ./*.apk
